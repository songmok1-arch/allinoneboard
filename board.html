<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM 올인원 보드</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html" style="color:inherit;"><span class="mark">A</span> PM 올인원 보드</a>
    <nav class="site-nav">
      <a href="dashboard.html">내 프로젝트 모아보기</a>
      <a href="index.html">새 프로젝트 만들기</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding:40px 0 16px;">
    <div class="wrap">
      <h1 id="projectTitle">불러오는 중...</h1>
      <div class="share-box">
        이 링크를 공유하면 누구나 함께 확인하고 참여할 수 있습니다 —
        <code id="shareUrl">...</code>
        <button class="btn ghost" id="copyLinkBtn">링크 복사</button>
        <button class="btn ghost" id="exportBtn">전체 현황 마크다운으로 복사</button>
        <a class="btn ghost" id="reportLink" href="#" target="_blank" rel="noopener">주간 리포트 보기</a>
        <button class="btn ghost" id="exportJsonBtn">JSON 백업 다운로드</button>
        <button class="btn ghost" id="exportCsvBtn">CSV 백업 다운로드</button>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="exec">실행 현황</button>
      <button type="button" class="tab-btn" data-tab="routine">정기 루틴</button>
    </div>
  </div>

  <!-- ===================== 실행 현황 (구 프로젝트보드) ===================== -->
  <div class="tab-panel" data-panel="exec">

    <!-- 회의록 / 액션아이템 -->
    <section style="padding-top:24px;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>회의록 / 액션아이템</h2>
            <span class="section-count" id="meetingCount"></span>
          </div>
          <div class="field-row-meeting">
            <div class="field" style="margin-bottom:0;">
              <label for="mtTitle">회의 제목</label>
              <input type="text" id="mtTitle" placeholder="예: 9월 3주차 주간 회의">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="mtDate">날짜</label>
              <input type="date" id="mtDate">
            </div>
            <button class="btn" id="mtAddBtn">회의 추가</button>
          </div>
          <div id="meetingList" style="margin-top:18px;"></div>
        </div>
      </div>
    </section>

    <!-- 마일스톤 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>마일스톤 / 일정</h2>
            <span class="section-count" id="milestoneCount"></span>
          </div>
          <div class="field-row3">
            <div class="field" style="margin-bottom:0;">
              <label for="msTitle">일정</label>
              <input type="text" id="msTitle" placeholder="예: 베타 오픈">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="msDue">기한</label>
              <input type="date" id="msDue">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="msMemo">메모</label>
              <input type="text" id="msMemo" placeholder="선택">
            </div>
            <button class="btn" id="msAddBtn">추가</button>
          </div>
          <div id="milestoneList" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <!-- 이슈/리스크 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>이슈 / 리스크</h2>
            <span class="section-count" id="issueCount"></span>
          </div>
          <div class="field-row3">
            <div class="field" style="margin-bottom:0;">
              <label for="isTitle">이슈</label>
              <input type="text" id="isTitle" placeholder="예: 결제 모듈 연동 지연">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="isSeverity">심각도</label>
              <select id="isSeverity">
                <option value="low">낮음</option>
                <option value="medium" selected>보통</option>
                <option value="high">높음</option>
                <option value="critical">긴급</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="isOwner">담당자</label>
              <input type="text" id="isOwner" placeholder="선택">
            </div>
            <button class="btn" id="isAddBtn">추가</button>
          </div>
          <div class="field" style="margin-top:-4px;">
            <input type="text" id="isMemo" placeholder="메모 (선택)">
          </div>
          <div id="issueList" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <!-- 피드백/승인 요청 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>피드백 / 승인 요청</h2>
            <span class="section-count" id="feedbackCount"></span>
          </div>
          <p class="section-hint">요청을 "승인됨"으로 바꾸면 실행을 놓치지 않도록 이슈/리스크 목록에 후속 이슈가 자동으로 생성됩니다.</p>
          <div class="field">
            <label for="fbTitle">요청 제목</label>
            <input type="text" id="fbTitle" placeholder="예: B안으로 최종 확정해도 될까요?">
          </div>
          <div class="field">
            <label for="fbDesc">설명 (선택)</label>
            <textarea id="fbDesc" placeholder="이해관계자가 판단하는 데 필요한 배경을 적어주세요."></textarea>
          </div>
          <button class="btn" id="fbAddBtn">요청 등록</button>
          <div id="feedbackList" style="margin-top:18px;"></div>
        </div>
      </div>
    </section>

  </div>

  <!-- ===================== 정기 루틴 (구 루틴보드) ===================== -->
  <div class="tab-panel" data-panel="routine" hidden>

    <!-- 상태보고서 -->
    <section style="padding-top:24px;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>상태보고서</h2>
            <span class="section-count" id="reportCount"></span>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="reportDate">보고서 날짜</label>
              <input type="date" id="reportDate">
            </div>
            <div class="field">
              <label for="health">상태 신호등</label>
              <select id="health">
                <option value="good">정상</option>
                <option value="warning">주의</option>
                <option value="risk">위험</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="progressSummary">이번 주 진행 요약</label>
            <textarea id="progressSummary" placeholder="이번 주 진행 상황을 요약해주세요"></textarea>
          </div>
          <div class="field">
            <label for="risksIssues">이슈·리스크</label>
            <textarea id="risksIssues" placeholder="현재 이슈나 리스크가 있다면 적어주세요"></textarea>
          </div>
          <div class="field">
            <label for="nextWeekPlan">다음 주 계획</label>
            <textarea id="nextWeekPlan" placeholder="다음 주에 진행할 계획을 적어주세요"></textarea>
          </div>
          <button class="btn" id="reportAddBtn">등록</button>
          <div id="reportList" style="margin-top:18px;"></div>
        </div>
      </div>
    </section>

    <!-- 워크로드 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>워크로드</h2>
            <span class="section-count" id="taskCount"></span>
          </div>
          <div class="field-row">
            <div class="field" style="margin-bottom:0;">
              <label for="taskTitle">업무</label>
              <input type="text" id="taskTitle" placeholder="예: 결제 모듈 QA">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="taskOwner">담당자</label>
              <input type="text" id="taskOwner" placeholder="예: 김민지">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="taskDue">마감일</label>
              <input type="date" id="taskDue">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="taskMemo">메모</label>
              <input type="text" id="taskMemo" placeholder="선택">
            </div>
            <button class="btn" id="taskAddBtn">추가</button>
          </div>
          <div id="taskList" style="margin-top:18px;"></div>
        </div>
      </div>
    </section>

    <!-- 리스크매트릭스 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="card">
          <div class="section-header">
            <h2>리스크매트릭스</h2>
            <span class="section-count" id="riskCount"></span>
          </div>
          <div class="field-row4">
            <div class="field" style="margin-bottom:0;">
              <label for="riskTitle">리스크</label>
              <input type="text" id="riskTitle" placeholder="예: 핵심 개발자가 다음 달 퇴사 예정">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="riskProbability">확률</label>
              <select id="riskProbability">
                <option value="low">낮음</option>
                <option value="medium" selected>보통</option>
                <option value="high">높음</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="riskImpact">영향</label>
              <select id="riskImpact">
                <option value="low">낮음</option>
                <option value="medium" selected>보통</option>
                <option value="high">높음</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="riskOwner">담당자</label>
              <input type="text" id="riskOwner" placeholder="선택">
            </div>
            <button class="btn" id="riskAddBtn">등록</button>
          </div>
          <div class="field" style="margin-top:-4px;">
            <label for="riskMitigation">대응 계획 (선택)</label>
            <textarea id="riskMitigation" placeholder="예: 발생 시 백업 인력 즉시 투입, 인수인계 문서 사전 작성"></textarea>
          </div>
          <div id="riskList" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <!-- 회고 -->
    <section style="padding-top:0;">
      <div class="wrap">
        <div class="section-header" style="margin-bottom:12px;">
          <h2>회고</h2>
        </div>
        <div class="retro-columns">

          <div class="card retro-column" data-category="good">
            <div class="retro-column-head">
              <h3>👍 잘한 점</h3>
              <span class="retro-column-count" id="count-good">0</span>
            </div>
            <div class="retro-list" id="list-good"></div>
            <div class="retro-add-form">
              <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="good" data-role="author">
              <textarea placeholder="잘한 점을 적어주세요" data-category="good" data-role="content"></textarea>
              <button class="btn small block" data-action="retro-add" data-category="good">추가</button>
            </div>
          </div>

          <div class="card retro-column" data-category="improve">
            <div class="retro-column-head">
              <h3>🤔 아쉬운 점</h3>
              <span class="retro-column-count" id="count-improve">0</span>
            </div>
            <div class="retro-list" id="list-improve"></div>
            <div class="retro-add-form">
              <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="improve" data-role="author">
              <textarea placeholder="아쉬운 점을 적어주세요" data-category="improve" data-role="content"></textarea>
              <button class="btn small block" data-action="retro-add" data-category="improve">추가</button>
            </div>
          </div>

          <div class="card retro-column" data-category="action">
            <div class="retro-column-head">
              <h3>➡ 다음 액션</h3>
              <span class="retro-column-count" id="count-action">0</span>
            </div>
            <div class="retro-list" id="list-action"></div>
            <div class="retro-add-form">
              <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="action" data-role="author">
              <textarea placeholder="다음에 할 액션을 적어주세요" data-category="action" data-role="content"></textarea>
              <button class="btn small block" data-action="retro-add" data-category="action">추가</button>
            </div>
          </div>

        </div>
      </div>
    </section>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div>&copy; 2026 PM 올인원 보드 — <a href="index.html">새 프로젝트 만들기</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("p");
  const projectTitleEl = document.getElementById("projectTitle");
  const shareUrlEl = document.getElementById("shareUrl");
  const reportDateInput = document.getElementById("reportDate");
  const retroCategories = ["good", "improve", "action"];

  let currentProject = null;
  let currentMilestones = [];
  let currentIssues = [];
  let currentFeedback = [];
  let currentComments = [];
  let currentMeetings = [];
  let currentActionItems = [];
  let currentReports = [];
  let currentTasks = [];
  let currentRisks = [];
  let currentRetroItems = [];

  reportDateInput.value = new Date().toISOString().slice(0, 10);

  /* ---------- 탭 전환 ---------- */
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((panel) => {
        panel.hidden = panel.getAttribute("data-panel") !== tab;
      });
    });
  });

  /* ========== 실행 현황 ========== */

  /* ---------- 회의록 / 액션아이템 ---------- */
  function actionItemsFor(meetingId) {
    return currentActionItems.filter((a) => a.meeting_id === meetingId);
  }

  function renderMeetings() {
    const listEl = document.getElementById("meetingList");
    document.getElementById("meetingCount").textContent = currentMeetings.length ? `${currentMeetings.length}건` : "";
    if (currentMeetings.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 회의가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentMeetings.forEach((mt) => {
      const items = actionItemsFor(mt.id);
      const card = document.createElement("div");
      card.className = "feedback-card";
      card.innerHTML = `
        <div class="meeting-head">
          <div class="item-task">${escapeHtml(mt.title)}${mt.meeting_date ? `<span class="memo">${mt.meeting_date}</span>` : ""}</div>
          <button class="btn danger-text" data-id="${mt.id}" data-action="mt-delete">회의 삭제</button>
        </div>
        <div class="meeting-items" id="items-${mt.id}">
          ${items.length === 0
            ? `<div class="item-meta">아직 등록된 액션아이템이 없습니다.</div>`
            : items.map((a) => `
              <div class="item-row" style="padding:8px 0;">
                <button class="status-pill status-${a.status}" data-id="${a.id}" data-action="ai-cycle">${actionItemStatusLabel(a.status)}</button>
                <div class="item-task">${escapeHtml(a.task)}</div>
                <div class="item-meta">${a.owner ? escapeHtml(a.owner) : ""}</div>
                <div class="item-meta">${a.due_date ? a.due_date + " 까지" : ""}</div>
                <button class="btn danger-text" data-id="${a.id}" data-action="ai-delete">삭제</button>
              </div>
            `).join("")
          }
        </div>
        <div class="meeting-subform">
          <input type="text" placeholder="할 일" data-mt="${mt.id}" data-role="task">
          <input type="text" placeholder="담당자 (선택)" data-mt="${mt.id}" data-role="owner">
          <input type="date" data-mt="${mt.id}" data-role="due">
          <button class="btn small" data-mt="${mt.id}" data-action="ai-add">추가</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  async function refreshMeetings() {
    currentMeetings = await loadMeetings(currentProject.id);
    currentActionItems = await loadActionItems(currentMeetings.map((m) => m.id));
    renderMeetings();
  }

  /* ---------- 마일스톤 ---------- */
  function renderMilestones() {
    const listEl = document.getElementById("milestoneList");
    document.getElementById("milestoneCount").textContent = currentMilestones.length ? `${currentMilestones.length}건` : "";
    if (currentMilestones.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 일정이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentMilestones.forEach((m) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <button class="status-pill status-${m.status}" data-id="${m.id}" data-action="ms-cycle">${milestoneStatusLabel(m.status)}</button>
        <div class="item-task">${escapeHtml(m.title)}${m.memo ? `<span class="memo">${escapeHtml(m.memo)}</span>` : ""}</div>
        <div class="item-meta">${m.due_date ? m.due_date + " 까지" : ""}</div>
        <div></div>
        <button class="btn danger-text" data-id="${m.id}" data-action="ms-delete">삭제</button>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshMilestones() {
    currentMilestones = await loadMilestones(currentProject.id);
    renderMilestones();
  }

  /* ---------- 이슈 ---------- */
  function renderIssues() {
    const listEl = document.getElementById("issueList");
    document.getElementById("issueCount").textContent = currentIssues.length ? `${currentIssues.length}건` : "";
    if (currentIssues.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 이슈가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentIssues.forEach((it) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <span class="severity-tag severity-${it.severity}">${severityLabel(it.severity)}</span>
        <div class="item-task">${escapeHtml(it.title)}${it.memo ? `<span class="memo">${escapeHtml(it.memo)}</span>` : ""}</div>
        <div class="item-meta">${it.owner ? escapeHtml(it.owner) : ""}</div>
        <button class="status-pill status-${it.status}" data-id="${it.id}" data-action="is-cycle">${issueStatusLabel(it.status)}</button>
        <button class="btn danger-text" data-id="${it.id}" data-action="is-delete">삭제</button>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshIssues() {
    currentIssues = await loadIssues(currentProject.id);
    renderIssues();
  }

  /* ---------- 피드백/승인 ---------- */
  function commentsFor(feedbackItemId) {
    return currentComments.filter((c) => c.feedback_item_id === feedbackItemId);
  }

  function renderFeedback() {
    const listEl = document.getElementById("feedbackList");
    document.getElementById("feedbackCount").textContent = currentFeedback.length ? `${currentFeedback.length}건` : "";
    if (currentFeedback.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 요청이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentFeedback.forEach((f) => {
      const comments = commentsFor(f.id);
      const card = document.createElement("div");
      card.className = "feedback-card";
      card.innerHTML = `
        <div class="feedback-head">
          <div>
            <div class="item-task">${escapeHtml(f.title)}</div>
            ${f.description ? `<p class="feedback-desc">${escapeHtml(f.description)}</p>` : ""}
          </div>
          <button class="status-pill status-${f.status}" data-id="${f.id}" data-action="fb-cycle">${feedbackStatusLabel(f.status)}</button>
        </div>
        <div class="comment-list" id="comments-${f.id}">
          ${comments.length === 0
            ? `<div class="item-meta">아직 댓글이 없습니다.</div>`
            : comments.map((c) => `<div class="comment-item"><span class="author">${escapeHtml(c.author_name)}</span>${escapeHtml(c.comment)}<span class="time">${c.created_at.slice(0, 10)}</span></div>`).join("")
          }
        </div>
        <div class="comment-form">
          <input type="text" class="author-input" placeholder="이름" data-fb="${f.id}" data-role="author">
          <input type="text" placeholder="의견을 남겨주세요" data-fb="${f.id}" data-role="comment">
          <button class="btn small" data-fb="${f.id}" data-action="fb-comment">등록</button>
        </div>
        <div class="feedback-actions">
          <button class="btn danger-text" data-id="${f.id}" data-action="fb-delete">요청 삭제</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  async function refreshFeedback() {
    currentFeedback = await loadFeedbackItems(currentProject.id);
    currentComments = await loadFeedbackComments(currentFeedback.map((f) => f.id));
    renderFeedback();
  }

  /* ========== 정기 루틴 ========== */

  /* ---------- 상태보고서 ---------- */
  function bodyOrEmpty(text) {
    return text ? escapeHtml(text) : `<span class="empty-state" style="padding:0;">작성된 내용이 없습니다.</span>`;
  }

  function renderReports() {
    const listEl = document.getElementById("reportList");
    document.getElementById("reportCount").textContent = currentReports.length ? `${currentReports.length}건` : "";
    if (currentReports.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 보고서가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentReports.forEach((r) => {
      const row = document.createElement("div");
      row.className = "report-card";
      row.innerHTML = `
        <div class="report-card-head">
          <div class="report-date">${escapeHtml(r.report_date)}</div>
          <span class="status-pill status-${escapeHtml(r.health)}">${healthLabel(r.health)}</span>
          <button class="btn danger-text" data-id="${r.id}" data-action="report-delete" style="margin-left:auto;">삭제</button>
        </div>
        <div class="report-section">
          <div class="label-sm">이번 주 진행 요약</div>
          <div class="body-text">${bodyOrEmpty(r.progress_summary)}</div>
        </div>
        <div class="report-section">
          <div class="label-sm">이슈·리스크</div>
          <div class="body-text">${bodyOrEmpty(r.risks_issues)}</div>
        </div>
        <div class="report-section">
          <div class="label-sm">다음 주 계획</div>
          <div class="body-text">${bodyOrEmpty(r.next_week_plan)}</div>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshReports() {
    currentReports = await loadReports(currentProject.id);
    renderReports();
  }

  /* ---------- 워크로드 ---------- */
  function renderTasks() {
    const listEl = document.getElementById("taskList");
    document.getElementById("taskCount").textContent = currentTasks.length ? `${currentTasks.length}건` : "";
    if (currentTasks.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 업무가 없습니다.</div>`;
      return;
    }
    const groups = groupByOwner(currentTasks);
    listEl.innerHTML = "";
    groups.forEach((g) => {
      const groupEl = document.createElement("div");
      groupEl.className = "owner-group";
      const badgeClass = g.activeCount > 0 ? "workload-badge" : "workload-badge zero";
      let rowsHtml = "";
      g.tasks.forEach((t) => {
        const due = t.due_date ? `<span class="item-meta">${escapeHtml(t.due_date)}</span>` : `<span class="item-meta"></span>`;
        rowsHtml += `
          <div class="item-row">
            <div class="item-task">${escapeHtml(t.title)}${t.memo ? `<span class="memo">${escapeHtml(t.memo)}</span>` : ""}</div>
            ${due}
            <button class="status-pill status-${t.status}" data-id="${t.id}" data-action="task-cycle">${taskStatusLabel(t.status)}</button>
            <button class="btn danger-text" data-id="${t.id}" data-action="task-delete">삭제</button>
          </div>
        `;
      });
      groupEl.innerHTML = `
        <div class="owner-head">
          <span class="name">${escapeHtml(g.owner_name)}</span>
          <span class="${badgeClass}">진행중 ${g.activeCount}건</span>
        </div>
        ${rowsHtml}
      `;
      listEl.appendChild(groupEl);
    });
  }

  async function refreshTasks() {
    currentTasks = await loadTasks(currentProject.id);
    renderTasks();
  }

  /* ---------- 리스크매트릭스 ---------- */
  function renderRisks() {
    const listEl = document.getElementById("riskList");
    document.getElementById("riskCount").textContent = currentRisks.length ? `${currentRisks.length}건` : "";
    if (currentRisks.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 리스크가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentRisks.forEach((it) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <span class="severity-tag ${riskLevelClass(it.probability, it.impact)}">${riskLevel(it.probability, it.impact)}</span>
        <div class="item-task">
          ${escapeHtml(it.title)}
          <span class="memo">확률: ${probabilityLabel(it.probability)} · 영향: ${impactLabel(it.impact)}</span>
          ${it.mitigation_plan ? `<span class="mitigation">대응 계획: ${escapeHtml(it.mitigation_plan)}</span>` : ""}
        </div>
        <div class="item-meta">${it.owner ? escapeHtml(it.owner) : ""}</div>
        <button class="status-pill status-${it.status}" data-id="${it.id}" data-action="risk-cycle">${riskStatusLabel(it.status)}</button>
        <button class="btn danger-text" data-id="${it.id}" data-action="risk-delete">삭제</button>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshRisks() {
    currentRisks = await loadRisks(currentProject.id);
    renderRisks();
  }

  /* ---------- 회고 ---------- */
  function renderRetroColumn(category) {
    const listEl = document.getElementById(`list-${category}`);
    const countEl = document.getElementById(`count-${category}`);
    const items = itemsByCategory(currentRetroItems, category);
    countEl.textContent = items.length;
    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 남긴 내용이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = items.map((i) => `
      <div class="retro-item">
        <div class="retro-item-head">
          <div>
            <span class="author">${escapeHtml(i.author_name)}</span>
            <div class="content">${escapeHtml(i.content)}</div>
          </div>
          <button class="del-btn" data-action="retro-delete" data-id="${i.id}" title="삭제">×</button>
        </div>
      </div>
    `).join("");
  }

  function renderRetro() {
    retroCategories.forEach(renderRetroColumn);
  }

  async function refreshRetroItems() {
    currentRetroItems = await loadRetroItems(currentProject.id);
    renderRetro();
  }

  /* ---------- 초기화 ---------- */
  async function init() {
    if (!code) {
      projectTitleEl.textContent = "프로젝트를 찾을 수 없습니다";
      return;
    }
    try {
      currentProject = await loadProjectByCode(code);
      projectTitleEl.textContent = currentProject.title;
      shareUrlEl.textContent = window.location.href;
      document.getElementById("reportLink").href = `report.html?p=${encodeURIComponent(code)}`;
      await Promise.all([
        refreshMeetings(), refreshMilestones(), refreshIssues(), refreshFeedback(),
        refreshReports(), refreshTasks(), refreshRisks(), refreshRetroItems(),
      ]);
    } catch (e) {
      projectTitleEl.textContent = "불러오지 못했습니다";
      document.getElementById("milestoneList").innerHTML = `<div class="empty-state">프로젝트 정보를 불러오지 못했습니다. config.js 설정과 Supabase 스키마를 확인해주세요.</div>`;
    }
  }

  /* ---------- 이벤트: 회의록 / 액션아이템 ---------- */
  document.getElementById("mtAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("mtTitle").value.trim();
    const date = document.getElementById("mtDate").value;
    if (!title || !currentProject) return;
    await addMeeting(currentProject.id, { title, meeting_date: date || null });
    document.getElementById("mtTitle").value = "";
    document.getElementById("mtDate").value = "";
    await refreshMeetings();
  });

  document.getElementById("meetingList").addEventListener("click", async (e) => {
    const deleteMtBtn = e.target.closest("button[data-action='mt-delete']");
    const cycleBtn = e.target.closest("button[data-action='ai-cycle']");
    const deleteAiBtn = e.target.closest("button[data-action='ai-delete']");
    const addAiBtn = e.target.closest("button[data-action='ai-add']");

    if (deleteMtBtn) {
      if (!confirm("이 회의를 삭제할까요? 액션아이템도 함께 삭제됩니다.")) return;
      await deleteMeeting(deleteMtBtn.getAttribute("data-id"));
      await refreshMeetings();
    } else if (cycleBtn) {
      const id = cycleBtn.getAttribute("data-id");
      const item = currentActionItems.find((x) => x.id === id);
      await updateActionItemStatus(id, nextActionItemStatus(item.status));
      await refreshMeetings();
    } else if (deleteAiBtn) {
      if (!confirm("이 액션아이템을 삭제할까요?")) return;
      await deleteActionItem(deleteAiBtn.getAttribute("data-id"));
      await refreshMeetings();
    } else if (addAiBtn) {
      const mtId = addAiBtn.getAttribute("data-mt");
      const taskInput = document.querySelector(`input[data-mt="${mtId}"][data-role="task"]`);
      const ownerInput = document.querySelector(`input[data-mt="${mtId}"][data-role="owner"]`);
      const dueInput = document.querySelector(`input[data-mt="${mtId}"][data-role="due"]`);
      const task = taskInput.value.trim();
      if (!task) return;
      await addActionItem(mtId, { task, owner: ownerInput.value.trim(), due_date: dueInput.value || null });
      await refreshMeetings();
    }
  });

  /* ---------- 이벤트: 마일스톤 ---------- */
  document.getElementById("msAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("msTitle").value.trim();
    const due = document.getElementById("msDue").value;
    const memo = document.getElementById("msMemo").value.trim();
    if (!title || !currentProject) return;
    await addMilestone(currentProject.id, { title, due_date: due || null, memo });
    document.getElementById("msTitle").value = "";
    document.getElementById("msDue").value = "";
    document.getElementById("msMemo").value = "";
    await refreshMilestones();
  });

  document.getElementById("milestoneList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "ms-cycle") {
      const m = currentMilestones.find((x) => x.id === id);
      await updateMilestoneStatus(id, nextMilestoneStatus(m.status));
      await refreshMilestones();
    } else if (action === "ms-delete") {
      if (!confirm("이 일정을 삭제할까요?")) return;
      await deleteMilestone(id);
      await refreshMilestones();
    }
  });

  /* ---------- 이벤트: 이슈 ---------- */
  document.getElementById("isAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("isTitle").value.trim();
    const severity = document.getElementById("isSeverity").value;
    const owner = document.getElementById("isOwner").value.trim();
    const memo = document.getElementById("isMemo").value.trim();
    if (!title || !currentProject) return;
    await addIssue(currentProject.id, { title, severity, owner, memo });
    document.getElementById("isTitle").value = "";
    document.getElementById("isOwner").value = "";
    document.getElementById("isMemo").value = "";
    document.getElementById("isSeverity").value = "medium";
    await refreshIssues();
  });

  document.getElementById("issueList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "is-cycle") {
      const it = currentIssues.find((x) => x.id === id);
      await updateIssueStatus(id, nextIssueStatus(it.status));
      await refreshIssues();
    } else if (action === "is-delete") {
      if (!confirm("이 이슈를 삭제할까요?")) return;
      await deleteIssue(id);
      await refreshIssues();
    }
  });

  /* ---------- 이벤트: 피드백/승인 ---------- */
  document.getElementById("fbAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("fbTitle").value.trim();
    const description = document.getElementById("fbDesc").value.trim();
    if (!title || !currentProject) return;
    await addFeedbackItem(currentProject.id, { title, description });
    document.getElementById("fbTitle").value = "";
    document.getElementById("fbDesc").value = "";
    await refreshFeedback();
  });

  document.getElementById("feedbackList").addEventListener("click", async (e) => {
    const cycleBtn = e.target.closest("button[data-action='fb-cycle']");
    const deleteBtn = e.target.closest("button[data-action='fb-delete']");
    const commentBtn = e.target.closest("button[data-action='fb-comment']");
    if (cycleBtn) {
      const id = cycleBtn.getAttribute("data-id");
      const f = currentFeedback.find((x) => x.id === id);
      const next = { pending: "approved", approved: "rejected", rejected: "pending" }[f.status] || "pending";
      await updateFeedbackStatus(id, next);
      if (next === "approved") {
        // 모듈 간 연동: 승인된 요청은 실행할 일로 놓치지 않도록 이슈로 자동 전환됩니다.
        await addIssue(currentProject.id, {
          title: `[승인 후속] ${f.title}`,
          severity: "medium",
          owner: null,
          memo: "피드백/승인 요청이 승인되어 자동으로 생성된 이슈입니다. 실행 후 상태를 갱신해주세요.",
        });
        await refreshIssues();
      }
      await refreshFeedback();
    } else if (deleteBtn) {
      if (!confirm("이 요청을 삭제할까요? 댓글도 함께 삭제됩니다.")) return;
      await deleteFeedbackItem(deleteBtn.getAttribute("data-id"));
      await refreshFeedback();
    } else if (commentBtn) {
      const fbId = commentBtn.getAttribute("data-fb");
      const authorInput = document.querySelector(`input[data-fb="${fbId}"][data-role="author"]`);
      const commentInput = document.querySelector(`input[data-fb="${fbId}"][data-role="comment"]`);
      const author_name = authorInput.value.trim() || "익명";
      const comment = commentInput.value.trim();
      if (!comment) return;
      await addFeedbackComment(fbId, { author_name, comment });
      await refreshFeedback();
    }
  });

  /* ---------- 이벤트: 상태보고서 ---------- */
  document.getElementById("reportAddBtn").addEventListener("click", async () => {
    if (!currentProject) return;
    const report_date = reportDateInput.value || new Date().toISOString().slice(0, 10);
    const health = document.getElementById("health").value;
    const progress_summary = document.getElementById("progressSummary").value.trim();
    const risks_issues = document.getElementById("risksIssues").value.trim();
    const next_week_plan = document.getElementById("nextWeekPlan").value.trim();
    await addReport(currentProject.id, { report_date, health, progress_summary, risks_issues, next_week_plan });
    document.getElementById("progressSummary").value = "";
    document.getElementById("risksIssues").value = "";
    document.getElementById("nextWeekPlan").value = "";
    document.getElementById("health").value = "good";
    reportDateInput.value = new Date().toISOString().slice(0, 10);
    await refreshReports();
  });

  document.getElementById("reportList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action='report-delete']");
    if (!btn) return;
    if (!confirm("이 보고서를 삭제할까요?")) return;
    await deleteReport(btn.getAttribute("data-id"));
    await refreshReports();
  });

  /* ---------- 이벤트: 워크로드 ---------- */
  document.getElementById("taskAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("taskTitle").value.trim();
    const ownerName = document.getElementById("taskOwner").value.trim();
    const dueDate = document.getElementById("taskDue").value;
    const memo = document.getElementById("taskMemo").value.trim();
    if (!title || !ownerName || !currentProject) return;
    await addTask(currentProject.id, { title, owner_name: ownerName, due_date: dueDate, memo });
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskOwner").value = "";
    document.getElementById("taskDue").value = "";
    document.getElementById("taskMemo").value = "";
    await refreshTasks();
  });

  document.getElementById("taskList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "task-cycle") {
      const item = currentTasks.find((i) => i.id === id);
      await updateTaskStatus(id, nextTaskStatus(item.status));
      await refreshTasks();
    } else if (action === "task-delete") {
      if (!confirm("이 업무를 삭제할까요?")) return;
      await deleteTask(id);
      await refreshTasks();
    }
  });

  /* ---------- 이벤트: 리스크매트릭스 ---------- */
  document.getElementById("riskAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("riskTitle").value.trim();
    const probability = document.getElementById("riskProbability").value;
    const impact = document.getElementById("riskImpact").value;
    const owner = document.getElementById("riskOwner").value.trim();
    const mitigation_plan = document.getElementById("riskMitigation").value.trim();
    if (!title || !currentProject) return;
    await addRisk(currentProject.id, { title, probability, impact, owner, mitigation_plan });
    document.getElementById("riskTitle").value = "";
    document.getElementById("riskOwner").value = "";
    document.getElementById("riskMitigation").value = "";
    document.getElementById("riskProbability").value = "medium";
    document.getElementById("riskImpact").value = "medium";
    await refreshRisks();
  });

  document.getElementById("riskList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "risk-cycle") {
      const item = currentRisks.find((i) => i.id === id);
      await updateRiskStatus(id, nextRiskStatus(item.status));
      await refreshRisks();
    } else if (action === "risk-delete") {
      if (!confirm("이 리스크를 삭제할까요?")) return;
      await deleteRisk(id);
      await refreshRisks();
    }
  });

  /* ---------- 이벤트: 회고 ---------- */
  document.querySelectorAll("button[data-action='retro-add']").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const category = btn.getAttribute("data-category");
      const authorInput = document.querySelector(`input[data-category="${category}"][data-role="author"]`);
      const contentInput = document.querySelector(`textarea[data-category="${category}"][data-role="content"]`);
      const content = contentInput.value.trim();
      if (!content || !currentProject) return;
      const author_name = authorInput.value.trim();
      await addRetroItem(currentProject.id, { category, content, author_name });
      authorInput.value = "";
      contentInput.value = "";
      await refreshRetroItems();
    });
  });

  document.querySelectorAll(".retro-list").forEach((listEl) => {
    listEl.addEventListener("click", async (e) => {
      const delBtn = e.target.closest("button[data-action='retro-delete']");
      if (!delBtn) return;
      if (!confirm("이 항목을 삭제할까요?")) return;
      await deleteRetroItem(delBtn.getAttribute("data-id"));
      await refreshRetroItems();
    });
  });

  /* ---------- 공유 / 내보내기 ---------- */
  document.getElementById("copyLinkBtn").addEventListener("click", async () => {
    const ok = await copyText(window.location.href);
    const btn = document.getElementById("copyLinkBtn");
    btn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => { btn.textContent = "링크 복사"; }, 1500);
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const md = exportMarkdown(currentProject, {
      milestones: currentMilestones,
      issues: currentIssues,
      feedbackItems: currentFeedback,
      meetings: currentMeetings,
      actionItems: currentActionItems,
      reports: currentReports,
      tasks: currentTasks,
      risks: currentRisks,
      retroItems: currentRetroItems,
    });
    const ok = await copyText(md);
    const btn = document.getElementById("exportBtn");
    btn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => { btn.textContent = "전체 현황 마크다운으로 복사"; }, 1500);
  });

  document.getElementById("exportJsonBtn").addEventListener("click", async () => {
    const btn = document.getElementById("exportJsonBtn");
    const original = btn.textContent;
    btn.textContent = "내려받는 중...";
    try {
      const data = await loadEverything(currentProject.id);
      const json = buildJSONExport(currentProject, data);
      const date = new Date().toISOString().slice(0, 10);
      downloadFile(`${safeFileName(currentProject.title)}_백업_${date}.json`, json, "application/json");
    } catch (e) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    } finally {
      btn.textContent = original;
    }
  });

  document.getElementById("exportCsvBtn").addEventListener("click", async () => {
    const btn = document.getElementById("exportCsvBtn");
    const original = btn.textContent;
    btn.textContent = "내려받는 중...";
    try {
      const data = await loadEverything(currentProject.id);
      const csv = buildCSVExport(currentProject, data);
      const date = new Date().toISOString().slice(0, 10);
      downloadFile(`${safeFileName(currentProject.title)}_백업_${date}.csv`, "\uFEFF" + csv, "text/csv;charset=utf-8;");
    } catch (e) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    } finally {
      btn.textContent = original;
    }
  });

  init();
</script>
</body>
</html>
