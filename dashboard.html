<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 프로젝트 모아보기 — PM 올인원 보드</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html" style="color:inherit;"><span class="mark">A</span> PM 올인원 보드</a>
    <nav class="site-nav">
      <a href="index.html">새 프로젝트 만들기</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding:40px 0 8px;">
    <div class="wrap">
      <p class="eyebrow">내 프로젝트 모아보기</p>
      <h1>여러 프로젝트를 한 화면에서</h1>
      <p class="lede" style="margin-bottom:0;">이 브라우저에서 만든 프로젝트들의 현재 상태를 한눈에 모아 보여줍니다. 각 카드를 눌러 보드나 주간 리포트로 바로 이동할 수 있습니다.</p>
    </div>
  </section>

  <div class="wrap">
    <p class="section-hint" id="scopeNote">불러오는 중...</p>
    <div id="dashGrid" class="dash-grid"></div>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div>&copy; 2026 PM 올인원 보드.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  function fmtDday(dueDate) {
    if (!dueDate) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + "T00:00:00");
    const diff = Math.round((due - today) / 86400000);
    if (diff === 0) return { text: "D-day", cls: "today" };
    if (diff > 0) return { text: `D-${diff}`, cls: "" };
    return { text: `D+${Math.abs(diff)}`, cls: "overdue" };
  }

  async function loadCardData(entry) {
    try {
      const project = await loadProjectByCode(entry.share_code);
      const [milestones, issues, risks, reports, tasks] = await Promise.all([
        loadMilestones(project.id),
        loadIssues(project.id),
        loadRisks(project.id),
        loadReports(project.id),
        loadTasks(project.id),
      ]);
      return { ok: true, entry, project, milestones, issues, risks, reports, tasks };
    } catch (e) {
      return { ok: false, entry };
    }
  }

  function renderCard(result) {
    const { entry } = result;
    const code = encodeURIComponent(entry.share_code);
    if (!result.ok) {
      return `
        <div class="card dash-card">
          <h3 class="report-item-title">${escapeHtml(entry.title)}</h3>
          <p class="report-empty">불러오지 못했습니다. 프로젝트가 삭제되었거나 일시적인 오류일 수 있습니다.</p>
          <a class="btn ghost" href="board.html?p=${code}">보드 열기</a>
        </div>`;
    }
    const { project, milestones, issues, risks, reports, tasks } = result;

    const openIssues = issues.filter((it) => it.status !== "resolved");
    const worstIssue = [...openIssues].sort((a, b) => {
      const w = { critical: 3, high: 2, medium: 1, low: 0 };
      return (w[b.severity] || 0) - (w[a.severity] || 0);
    })[0];

    const openRisks = risks.filter((r) => r.status !== "closed");
    const worstRisk = [...openRisks].sort((a, b) => riskScore(b.probability, b.impact) - riskScore(a.probability, a.impact))[0];

    const latestReport = reports[0];
    const activeTasks = tasks.filter((t) => t.status !== "done");

    const nextMilestone = [...milestones]
      .filter((m) => m.status !== "done" && m.due_date)
      .sort((a, b) => new Date(a.due_date) - new Date(b.due_date))[0];

    const chips = [];
    if (worstIssue) {
      chips.push(`<span class="severity-tag severity-${worstIssue.severity}">이슈 ${severityLabel(worstIssue.severity)}</span>`);
    }
    if (worstRisk) {
      chips.push(`<span class="severity-tag ${riskLevelClass(worstRisk.probability, worstRisk.impact)}">리스크 ${riskLevel(worstRisk.probability, worstRisk.impact)}</span>`);
    }
    if (latestReport) {
      chips.push(`<span class="status-pill status-${latestReport.health}">보고 ${healthLabel(latestReport.health)}</span>`);
    }
    if (!chips.length) chips.push(`<span class="report-empty">특이사항 없음</span>`);

    const ddayHtml = nextMilestone
      ? (() => { const d = fmtDday(nextMilestone.due_date); return `<span class="dday-badge ${d.cls}">${escapeHtml(nextMilestone.title)} ${d.text}</span>`; })()
      : "";

    return `
      <div class="card dash-card">
        <div class="report-item-top">
          <h3 class="report-item-title" style="font-size:1.05rem;">${escapeHtml(project.title)}</h3>
          <span class="mono-ish">업무 ${activeTasks.length}건 진행중</span>
        </div>
        <div class="attn-row" style="margin:10px 0;">${chips.join("")}</div>
        ${ddayHtml ? `<p style="margin:6px 0 14px;">${ddayHtml}</p>` : ""}
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a class="btn ghost" href="board.html?p=${code}">보드 열기</a>
          <a class="btn ghost" href="report.html?p=${code}">주간 리포트</a>
        </div>
      </div>`;
  }

  async function init() {
    const list = getRecentProjects();
    const gridEl = document.getElementById("dashGrid");
    const noteEl = document.getElementById("scopeNote");
    if (!list.length) {
      noteEl.textContent = "이 브라우저에서 만든 프로젝트가 없습니다. 프로젝트를 새로 만들거나, 다른 브라우저에서 만드셨다면 그 브라우저에서 열어주세요.";
      gridEl.innerHTML = "";
      return;
    }
    noteEl.textContent = `이 브라우저에서 만든 프로젝트 ${list.length}개를 보여줍니다. 다른 컴퓨터·브라우저에서 만든 프로젝트는 이 목록에 나타나지 않습니다 — 로그인 없는 링크 기반 구조라 브라우저별로 기억됩니다.`;
    gridEl.innerHTML = `<p class="report-empty">불러오는 중...</p>`;
    const results = await Promise.all(list.map(loadCardData));
    gridEl.innerHTML = results.map(renderCard).join("");
  }

  init();
</script>
</body>
</html>
